
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        h1 {
            color: #222;
            margin-bottom: 12px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 45px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 45px;
        }

        .circle-link {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #4834d4);
            color: white;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(72, 52, 212, 0.2);
            transition: 0.3s ease;
        }

        .circle-link:nth-child(2) {
            background: linear-gradient(135deg, #00b894, #008f72);
        }

        .circle-link:nth-child(3) {
            background: linear-gradient(135deg, #ff7675, #d63031);
        }

        .circle-link:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.2);
        }

        .circle-link h2 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .circle-link p {
            font-size: 13px;
            line-height: 1.5;
        }

        footer {
            margin-top: 55px;
            color: #888;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                gap: 25px;
            }

            .circle-link {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>

<body>

    <h1>My Assignments</h1>

    <div class="container">

           target="_blank" rel="noopener noreferrer">
            <h2>A1</h2>
         
        </a>

        <!-- Circle Button 2: Replace the URL below -->

           target="_blank" rel="noopener noreferrer">
            <h2>A2</h2>
          
        </a>

        <!-- Circle Button 3: Replace the URL below -->
        <a href="https://qurat-ulain123.github.io/web-development/A3/" class="circle-link"
           target="_blank" rel="noopener noreferrer">
            <h2>A3</h2>
          
        </a>

    </div>

    <footer>
        &copy; 2026 My Links Page. All rights reserved.
    </footer>

</body>
</html>
